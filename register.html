{% extends "base.html" %}

{% block title %}用户注册{% endblock %}

{% block content %}

<div class="box" style="max-width: 420px; margin: 50px auto;">

    <h2 style="text-align: center;">
        用户注册
    </h2>
    <form method="post">
        <p>
            用户名
        </p>

        <input type="text"
               name="username"
               placeholder="请输入用户名"
               required
               style="width: 100%; box-sizing: border-box; padding: 10px;">

        <p>
            密码
        </p>

        <input type="password"
               name="password"
               placeholder="请输入密码"
               required
               style="width: 100%; box-sizing: border-box; padding: 10px;">

        <br><br>

        <button type="submit"
                style="width: 100%; padding: 10px;">
            注册
        </button>

    </form>

    <p style="text-align: center; margin-top: 20px;">
        已经有账号？
        <a href="{{ url_for('login') }}">
            去登录
        </a>
    </p>

</div>

{% endblock %}
